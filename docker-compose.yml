version: '3.8'

services:
  remoclic-be:
    image: remoclic-be:latest
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - WATCHFILES_FORCE_COLORS=true
    # Use reload for development, for production it should probably be just uvicorn app.main:app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
